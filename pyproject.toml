[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-passive-cti"
dynamic = ["version"]
description = "Passive, receive-only network threat detection for unidirectional (data-diode) monitoring enclaves"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "scapy>=2.5.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28.0", "plotly>=5.18.0", "requests>=2.31.0"]
dev = ["pytest>=7.4.0", "httpx>=0.24", "ruff>=0.6"]

[project.scripts]
aegis = "app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # scapy's own DNS layer warns about its field API; not actionable here.
    "ignore:The DNS fields:DeprecationWarning",
]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["data", "models"]

[tool.ruff.lint]
# Correctness-focused rule set: pyflakes + error-level pycodestyle.
select = ["E9", "F"]
